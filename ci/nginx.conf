user  nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: resolve upstreams per request so nginx starts
    # even if a backend container is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $skud_backend http://skud_face_app:8000;
    set $trt_api      http://trt-api:9999;
    set $trt_broker   http://trt-broker:6666;
    set $minio        http://trt-minio:9000;

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri /index.html;
    }

    # no bucket listings - only direct object URLs
    location ~ ^/media/[^/]*/?$ {
      return 404;
    }

    # face crops from the recognition face DB (MinIO, public-read buckets)
    location /media/ {
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass $minio;
      proxy_set_header Host trt-minio:9000;
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "public, max-age=3600";
    }

    location /api/v1/ {
      proxy_pass $skud_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      add_header X-From-Nginx-Proxy "true";
    }

    location /api/monitoring/ {
      rewrite ^/api/monitoring/(.*)$ /$1 break;
      proxy_pass $trt_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/events/ {
      rewrite ^/api/events/(.*)$ /$1 break;
      proxy_pass $trt_broker;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /api/events;

      proxy_buffering off;
      proxy_cache off;
      proxy_request_buffering off;
      chunked_transfer_encoding off;

      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;

      add_header X-Accel-Buffering no;
      add_header Cache-Control "no-cache";

      proxy_redirect off;
    }
  }
}
