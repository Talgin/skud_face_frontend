name: CI/CD Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  PUBLIC_API_BASE_URL: /api/v1
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build (rsbuild)
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repo name to lowercase
        id: repo
        run: echo "repo_lc=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}:${{ env.IMAGE_SHA }}
            ghcr.io/${{ steps.repo.outputs.repo_lc }}:latest
          build-args: |
            PUBLIC_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}

      - name: Copy repo to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "./"
          target: "/root/skud_face_frontend"
          rm: true

      - name: Pull & restart container over SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /root/skud_face_frontend

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            REPO_RAW="${{ github.repository }}"
            REPO_LC="$(echo "${REPO_RAW}" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_REPO="ghcr.io/${REPO_LC}"
            export IMAGE_TAG="${{ github.sha }}"
            export COMPOSE_PROJECT_NAME="skud_face_frontend"
            echo "Using image: ${IMAGE_REPO}:${IMAGE_TAG}"
            echo "Project: ${COMPOSE_PROJECT_NAME}"

            cleanup_frontend() {
              echo "[cleanup] remove only frontend containers & networks (project-scoped)"

              docker ps -aq --filter "name=^${COMPOSE_PROJECT_NAME}-" | xargs -r docker rm -f || true

              docker network ls --format '{{.Name}}' | grep -E "^${COMPOSE_PROJECT_NAME}(_|$)" | xargs -r docker network rm || true
            }

            docker compose pull

            set +e
            docker compose up -d --force-recreate --remove-orphans
            RC=$?
            set -e

            if [ "$RC" -ne 0 ]; then
              echo "[warn] compose up failed (rc=$RC). Try graceful stop & cleanup…"
              docker compose down --remove-orphans --timeout 0 || true
              cleanup_frontend

              echo "[info] retry compose up once"
              set +e
              docker compose up -d --force-recreate --remove-orphans
              RC2=$?
              set -e
              if [ "$RC2" -ne 0 ]; then
                echo "[warn] second attempt failed. Restarting docker daemon and doing targeted cleanup…"
                systemctl restart docker
                sleep 3
                cleanup_frontend
                docker compose up -d --force-recreate --remove-orphans
              fi
            fi

            echo "== running containers =="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
