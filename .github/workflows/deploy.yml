name: CI/CD Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  PUBLIC_API_BASE_URL: /api/v1
  IMAGE_REPO: ${{ format('ghcr.io/{0}/skud_face_frontend', github.repository_owner)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build (rsbuild)
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}:latest
          build-args: |
            PUBLIC_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}

      - name: Copy repo to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "./"
          target: "/root/skud_face_frontend"
          rm: true

      - name: Pull & restart container over SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /root/skud_face_frontend

            docker login ghcr.io -u "${{ secrets.GHCR_USER }}" -p "${{ secrets.GHCR_TOKEN }}"

            export GITHUB_REPOSITORY="${{ github.repository }}"
            export IMAGE_TAG="${{ github.sha }}"
            echo "Using image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"

            docker compose down --remove-orphans || true
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans

            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
