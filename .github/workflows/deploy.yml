name: CI/CD Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  PUBLIC_API_BASE_URL: /api/v1
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build (rsbuild)
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repo name to lowercase
        id: repo
        run: echo "repo_lc=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}:${{ env.IMAGE_SHA }}
            ghcr.io/${{ steps.repo.outputs.repo_lc }}:latest
          build-args: |
            PUBLIC_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}

      - name: Copy repo to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "./"
          target: "/root/skud_face_frontend"
          rm: true

      - name: Pull & restart container over SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /root/skud_face_frontend

            systemctl stop openfortivpn || true

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            REPO_RAW="${{ github.repository }}"
            REPO_LC="$(echo "${REPO_RAW}" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_REPO="ghcr.io/${REPO_LC}"
            export IMAGE_TAG="${{ github.sha }}"
            export COMPOSE_PROJECT_NAME="skud_face_frontend"
            echo "Using image: ${IMAGE_REPO}:${IMAGE_TAG}"
            echo "Project: ${COMPOSE_PROJECT_NAME}"

            docker compose pull

            set +e
            docker compose up -d --force-recreate --remove-orphans
            RC=$?
            set -e

            if [ "$RC" -ne 0 ]; then
              echo "[warn] compose up failed (rc=$RC). Start targeted cleanup…"

              docker ps -a --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" -q | xargs -r docker update --restart=no || true

              docker compose down --remove-orphans --timeout 0 || true

              CIDS="$(docker ps -a --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" -q)"
              if [ -n "${CIDS}" ]; then
                for id in ${CIDS}; do
                  pgrep -a -f "containerd-shim.*${id}" | awk '{print $1}' | xargs -r kill -9 || true
                done
                echo "${CIDS}" | xargs -r docker rm -f || true
              fi

              docker network ls --format '{{.Name}}' \
                --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
                | xargs -r docker network rm || true

              systemctl restart docker
              sleep 3

              docker ps -a --format '{{.ID}}\t{{.Names}}' \
                | awk '/skud_face_frontend-skud_frontend-1/ {print $1}' \
                | xargs -r docker rm -f || true

              docker rm -f skud_face_frontend-skud_frontend-1 2>/dev/null || true

              docker compose up -d --force-recreate --remove-orphans
            fi

            echo "== running containers =="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            systemctl start openfortivpn || true
