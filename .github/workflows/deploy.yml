name: CI/CD Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install deps
        run: npm ci

      - name: Build (rsbuild)
        run: npm run build

      - name: Copy repo to server via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "./"
          target: "/root/skud_face_frontend"
          rm: true

      - name: Build & restart container over SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /root/skud_face_frontend

            echo "== docker info =="
            docker info | egrep -i 'Server Version|Cgroup' || true

            echo "== compose down (remove orphans) =="
            if ! docker compose down --remove-orphans; then
              echo "compose down failed; will try restart docker"
            fi

            docker rm -f skud_face_frontend-nginx-react-1 2>/dev/null || true
            docker rm -f skud_frontend 2>/dev/null || true

            docker ps -a --format '{{.ID}}\t{{.Names}}' | awk '/skud_frontend|nginx-react/ {print $1}' | xargs -r docker kill || true
            docker ps -a --format '{{.ID}}\t{{.Names}}' | awk '/skud_frontend|nginx-react/ {print $1}' | xargs -r docker rm -f || true

            echo "== restart docker daemon (just in case) =="
            systemctl restart docker

            docker compose down --remove-orphans || true

            echo "== compose build --pull =="
            docker compose build --pull

            echo "== compose up (force recreate, remove orphans) =="
            docker compose up -d --force-recreate --remove-orphans

            echo "== running containers =="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
