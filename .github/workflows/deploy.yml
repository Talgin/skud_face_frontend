name: CI/CD Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  PUBLIC_API_BASE_URL: /api/v1
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build (rsbuild)
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repo name to lowercase
        id: repo
        run: echo "repo_lc=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}:${{ env.IMAGE_SHA }}
            ghcr.io/${{ steps.repo.outputs.repo_lc }}:latest
          build-args: |
            PUBLIC_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}

      - name: Copy repo to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "./"
          target: "/root/skud_face_frontend"
          rm: true

      - name: Pull & restart container over SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /root/skud_face_frontend

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            REPO_RAW="${{ github.repository }}"
            REPO_LC="$(echo "${REPO_RAW}" | tr '[:upper:]' '[:lower:]')"
            IMAGE_REPO="ghcr.io/${REPO_LC}"
            IMAGE_TAG="${{ github.sha }}"
            echo "Using image: ${IMAGE_REPO}:${IMAGE_TAG}"

            export IMAGE_REPO IMAGE_TAG

            echo "== stop old containers =="
            docker compose down --remove-orphans || true
            docker compose rm -fs skud_frontend || true

            echo "== pull new image =="
            docker compose pull

            echo "== start new container =="
            docker compose up -d --force-recreate --remove-orphans

            echo "== running containers =="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
